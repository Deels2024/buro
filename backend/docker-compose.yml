services:
  api:
    build: .
    env_file: .env
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080 --no-proxy-headers"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bureau
      POSTGRES_USER: bureau
      POSTGRES_PASSWORD: bureau
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bureau -d bureau"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: bureau
      MINIO_ROOT_PASSWORD: replace-this-minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  openclip:
    profiles: ["ai"]
    build: ./openclip_service
    environment:
      OPENCLIP_MODEL: ViT-B-32
      OPENCLIP_PRETRAINED: laion2b_s34b_b79k
      OPENCLIP_ALLOWED_IMAGE_HOSTS: minio,localhost,127.0.0.1
    volumes:
      - openclip_cache:/home/openclip/.cache
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  openclip_cache:

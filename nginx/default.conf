map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# The public HTTPS proxy runs on the same host, in front of this Docker
# gateway. Trust only loopback/private hops and recursively select the last
# non-trusted address, so a client-supplied X-Forwarded-For value cannot choose
# another SMS rate-limit bucket.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from ::1/128;
set_real_ip_from fc00::/7;
set_real_ip_from fe80::/10;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  ~^https$ https;
}

limit_req_zone $binary_remote_addr zone=deployment_configuration:10m rate=5r/m;

server {
  listen 80;
  server_name www.edinburo.ru;
  return 308 https://edinburo.ru$request_uri;
}

server {
  listen 80 default_server;
  server_name edinburo.ru localhost _;
  client_max_body_size 100m;

  # Docker may assign new addresses when api/admin containers are recreated.
  # Resolve service names per request so Nginx never keeps stale container IPs.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8080;
  set $web_upstream web:80;

  location = /v1/internal/deployment/openai-key {
    client_max_body_size 1k;
    limit_req zone=deployment_configuration burst=2 nodelay;
    limit_except POST { deny all; }
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /v1/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location ~ ^/(docs|redoc|openapi\.json) {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /admin {
    return 308 https://admin.edinburo.ru/;
  }

  location ^~ /admin/ {
    return 308 https://admin.edinburo.ru$request_uri;
  }

  location / {
    proxy_pass http://$web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  server_name admin.edinburo.ru;
  client_max_body_size 100m;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $admin_upstream admin:3000;

  location / {
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  ~^https$ https;
}

server {
  listen 80 default_server;
  server_name edinburo.ru www.edinburo.ru localhost _;
  client_max_body_size 100m;

  # Docker may assign new addresses when api/admin containers are recreated.
  # Resolve service names per request so Nginx never keeps stale container IPs.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8080;
  set $web_upstream web:80;

  location /v1/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location ~ ^/(docs|redoc|openapi\.json) {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /admin {
    return 308 https://admin.edinburo.ru/;
  }

  location ^~ /admin/ {
    return 308 https://admin.edinburo.ru$request_uri;
  }

  location / {
    proxy_pass http://$web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  server_name admin.edinburo.ru;
  client_max_body_size 100m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $admin_upstream admin:3000;

  location / {
    proxy_pass http://$admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

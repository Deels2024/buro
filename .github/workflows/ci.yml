name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e './backend[dev]' pip-audit bandit
      - name: Check backend
        run: |
          cd backend
          ruff check .
          pytest -q
          python scripts/validate_project.py
          python scripts/export_openapi.py --check
          pip-audit
          bandit -q -r app scripts

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node tool/validate_project.js

  stack:
    runs-on: ubuntu-latest
    needs: [backend, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Install and smoke-test the Docker stack
        run: ./install.sh
      - name: Verify running services
        run: ./scripts/check.sh
      - name: Show service status on failure
        if: failure()
        run: docker compose ps --all
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes

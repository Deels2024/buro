name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bureau
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bureau_ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bureau -d bureau_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://bureau:ci-only-password@localhost:5432/bureau_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e './backend[dev]' pip-audit bandit
      - name: Generate contract artifact
        run: cd backend && python scripts/export_openapi.py --output /tmp/generated-openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: generated-openapi
          path: /tmp/generated-openapi.json
      - name: Check backend
        run: |
          cd backend
          ruff check .
          pytest -q
          python scripts/validate_project.py
          python scripts/export_openapi.py --check
          pip-audit
          bandit -q -r app scripts

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-lock
          path: flutter/pubspec.lock
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href=/app/ --dart-define=BUREAU_API_URL=https://edinburo.ru/v1
      - run: node tool/validate_project.js

  stack:
    runs-on: ubuntu-latest
    needs: [backend, admin, flutter]
    steps:
      - uses: actions/checkout@v4
      - name: Install and smoke-test the Docker stack
        run: ./install.sh
      - name: Verify running services
        run: ./scripts/check.sh
      - name: Show service status on failure
        if: failure()
        run: docker compose ps --all
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes

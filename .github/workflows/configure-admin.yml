name: Configure production administrator

on:
  workflow_dispatch:

permissions: {}

jobs:
  configure:
    if: github.ref == 'refs/heads/main' && github.actor_id == '160591824'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    concurrency:
      group: production-buro-administrator
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - name: Grant administrator access to the verified account
        shell: python
        env:
          ADMIN_PHONE: ${{ secrets.BN_BOOTSTRAP_ADMIN_PHONE }}
        run: |
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class RejectRedirects(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def fail(message):
              print(f"::error::{message}")
              raise SystemExit(1)

          phone = os.environ.pop("ADMIN_PHONE", "").strip()
          if not re.fullmatch(r"\+7[0-9]{10}", phone):
              fail("Set the BN_BOOTSTRAP_ADMIN_PHONE secret in international +7 format.")
          url = "https://edinburo.ru/v1/internal/deployment/administrator"
          oidc_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          token = os.environ.pop("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          if not oidc_url or not token:
              fail("GitHub OIDC is unavailable.")
          opener = build_opener(RejectRedirects)
          separator = "&" if "?" in oidc_url else "?"
          request = Request(oidc_url + separator + "audience=" + quote(url, safe=""),
                            headers={"Authorization": "Bearer " + token})
          try:
              with opener.open(request, timeout=30) as response:
                  oidc = json.loads(response.read(65537))["value"]
          except (HTTPError, URLError, TimeoutError, ValueError, KeyError):
              fail("Could not obtain GitHub authentication.")
          request = Request(url, data=phone.encode("ascii"), method="POST", headers={
              "Authorization": "Bearer " + oidc, "Content-Type": "application/octet-stream",
              "Cache-Control": "no-store",
          })
          del phone, token, oidc
          try:
              with opener.open(request, timeout=60) as response:
                  result = json.loads(response.read(8193))
          except HTTPError as error:
              if error.code == 409:
                  fail("First sign in to the PWA with this phone and verify its SMS code. Then rerun.")
              fail(f"Administrator configuration rejected (HTTP {error.code}).")
          except (URLError, TimeoutError, ValueError):
              fail("Administrator configuration could not be confirmed.")
          if result != {"status": "configured", "role": "admin"}:
              fail("Administrator configuration was not confirmed.")
          print("Administrator configured. Sign in to the admin console with a fresh SMS code.")

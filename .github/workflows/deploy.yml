name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-buro
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The first Flutter image build can take longer on the production host
    # while its multi-gigabyte SDK layers and compiler cache are warming up.
    timeout-minutes: 45
    steps:
      - name: Configure deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '5.183.191.139 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL2znjGx+xsElDocnV/OCsk5UTosfxnzC79N0h8Apod7F8y/Gpxe6d8uE2/IsXSSVbqh98RlWbYImrF/LV/N2vI=' > ~/.ssh/known_hosts
      - name: Deploy edinburo.ru
        run: >-
          ssh
          -o IdentitiesOnly=yes
          -o BatchMode=yes
          -o ConnectTimeout=60
          -o ServerAliveInterval=15
          -o ServerAliveCountMax=4
          root@5.183.191.139
      - name: Verify public endpoints
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            web_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://edinburo.ru/ || true)"
            admin_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://admin.edinburo.ru/ || true)"
            api_body="$(curl --silent --show-error --fail --max-time 15 https://edinburo.ru/v1/health/ready || true)"
            if [[ "$web_status" == "200" && "$admin_status" == "200" && "$api_body" == *'"status":"ready"'* ]]; then
              printf 'Public deployment is healthy (web=%s admin=%s).\n' "$web_status" "$admin_status"
              exit 0
            fi
            printf 'Attempt %s/12: web=%s admin=%s api=%s\n' "$attempt" "$web_status" "$admin_status" "${api_body:-unavailable}"
            sleep 5
          done

          printf 'Deployment did not become healthy.\n' >&2
          exit 1

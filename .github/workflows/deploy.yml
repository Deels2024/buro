name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-buro
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Flutter compilation happens in CI; the VPS downloads tested files.
    timeout-minutes: 20
    steps:
      - name: Verify runtime is published before connecting to the VPS
        env:
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: >-
          curl --fail --silent --show-error --location --max-time 30
          "https://github.com/Deels2024/buro/releases/download/runtime-$EXPECTED_RELEASE/web.sha256"
      - name: Configure deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '5.183.191.139 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL2znjGx+xsElDocnV/OCsk5UTosfxnzC79N0h8Apod7F8y/Gpxe6d8uE2/IsXSSVbqh98RlWbYImrF/LV/N2vI=' > ~/.ssh/known_hosts
      - name: Deploy edinburo.ru
        run: >-
          ssh
          -o IdentitiesOnly=yes
          -o BatchMode=yes
          -o ConnectTimeout=60
          -o ServerAliveInterval=15
          -o ServerAliveCountMax=4
          root@5.183.191.139
      - name: Verify public endpoints
        env:
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            web_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://edinburo.ru/ || true)"
            admin_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 https://admin.edinburo.ru/ || true)"
            api_body="$(curl --silent --show-error --fail --max-time 15 https://edinburo.ru/v1/health/ready || true)"
            web_release="$(curl --silent --show-error --fail --max-time 15 https://edinburo.ru/app/release-sha.txt || true)"
            robots_body="$(curl --silent --show-error --fail --max-time 15 https://edinburo.ru/robots.txt || true)"
            sitemap_body="$(curl --silent --show-error --fail --max-time 15 https://edinburo.ru/sitemap.xml || true)"
            version_ok="$(jq -r --arg sha "$EXPECTED_RELEASE" '(.release_sha == $sha) and (.worker == "ok") and (.sms == "configured") and (.storage_transport == "https")' <<<"${api_body:-{}}" 2>/dev/null || true)"
            if [[ "$version_ok" == "true" && "$web_release" == "$EXPECTED_RELEASE" && "$web_status" == "200" && "$admin_status" == "200" && "$api_body" == *'"status":"ready"'* && "$robots_body" == *'Sitemap: https://edinburo.ru/sitemap.xml'* && "$sitemap_body" == *'<loc>https://edinburo.ru/</loc>'* ]]; then
              printf 'Public deployment is healthy (web=%s admin=%s SEO=ready).\n' "$web_status" "$admin_status"
              exit 0
            fi
            printf 'Attempt %s/12: web=%s admin=%s api=%s robots=%s sitemap=%s\n' "$attempt" "$web_status" "$admin_status" "${api_body:-unavailable}" "${robots_body:+available}" "${sitemap_body:+available}"
            sleep 5
          done

          printf 'Deployment did not become healthy.\n' >&2
          exit 1

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-buro
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # Flutter compilation happens in CI; the VPS downloads tested files.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Check public DNS and TLS before changing running containers
        run: python3 scripts/check-public.py --preflight --report preflight.json
      - name: Verify runtime is published before connecting to the VPS
        env:
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: >-
          curl --fail --silent --show-error --location --max-time 30
          "https://github.com/Deels2024/buro/releases/download/runtime-$EXPECTED_RELEASE/web.sha256"
      - name: Configure deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '5.183.191.139 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL2znjGx+xsElDocnV/OCsk5UTosfxnzC79N0h8Apod7F8y/Gpxe6d8uE2/IsXSSVbqh98RlWbYImrF/LV/N2vI=' > ~/.ssh/known_hosts
      - name: Deploy edinburo.ru
        run: >-
          ssh
          -o IdentitiesOnly=yes
          -o BatchMode=yes
          -o ConnectTimeout=60
          -o ServerAliveInterval=15
          -o ServerAliveCountMax=4
          root@5.183.191.139
      - name: Verify public endpoints and exact release
        env:
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 scripts/check-public.py --expected-release "$EXPECTED_RELEASE" --attempts 12 --report acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-acceptance
          path: |
            preflight.json
            acceptance.json
          if-no-files-found: ignore
          retention-days: 14

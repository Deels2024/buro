name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-buro
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # Flutter compilation happens in CI; the VPS downloads tested files.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Check public DNS and TLS before changing running containers
        # Record existing outages without preventing delivery of tested fixes.
        # Final acceptance below remains mandatory and reports any open issue.
        continue-on-error: true
        run: python3 scripts/check-public.py --preflight --report preflight.json
      - name: Verify runtime is published before connecting to the VPS
        env:
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: >-
          curl --fail --silent --show-error --location --max-time 30
          "https://github.com/Deels2024/buro/releases/download/runtime-$EXPECTED_RELEASE/web.sha256"
      - name: Configure deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '5.183.191.139 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL2znjGx+xsElDocnV/OCsk5UTosfxnzC79N0h8Apod7F8y/Gpxe6d8uE2/IsXSSVbqh98RlWbYImrF/LV/N2vI=' > ~/.ssh/known_hosts
      - name: Deploy edinburo.ru
        run: >-
          ssh
          -o IdentitiesOnly=yes
          -o BatchMode=yes
          -o ConnectTimeout=60
          -o ServerAliveInterval=15
          -o ServerAliveCountMax=4
          root@5.183.191.139
      - name: Verify public endpoints and exact release
        env:
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 scripts/check-public.py --expected-release "$EXPECTED_RELEASE" --attempts 12 --report acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-acceptance
          path: |
            preflight.json
            acceptance.json
          if-no-files-found: ignore
          retention-days: 14

  maps-diagnostics:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    permissions:
      id-token: write
    steps:
      - name: Compare Yandex connection routes without exposing keys
        shell: python
        env:
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class RejectRedirects(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def fail(message):
              print(f"::error::{message}")
              raise SystemExit(1)

          endpoint = "https://edinburo.ru/v1/internal/deployment/yandex-diagnostics"
          opener = build_opener(RejectRedirects)
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          request = Request(url + separator + "audience=" + quote(endpoint, safe=""), headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
          })
          try:
              with opener.open(request, timeout=20) as response:
                  raw = response.read(65537)
              if len(raw) > 65536:
                  fail("OIDC response is too large.")
              token = json.loads(raw)["value"]
              request = Request(endpoint, data=b"", method="POST", headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
                  "Cache-Control": "no-store",
              })
              del token
              with opener.open(request, timeout=50) as response:
                  raw = response.read(16385)
          except HTTPError as error:
              fail(f"Maps diagnostics returned HTTP {error.code}.")
          except (URLError, TimeoutError, json.JSONDecodeError, KeyError):
              fail("Maps diagnostics connection or authentication failed.")
          if len(raw) > 16384:
              fail("Maps diagnostics response is too large.")
          result = json.loads(raw)
          if result.get("release_sha") != os.environ["EXPECTED_RELEASE"]:
              fail("Maps diagnostics ran on an unexpected release.")
          allowed_reasons = {
              "ok", "empty_result", "referer_restricted", "ip_restricted", "invalid_key",
              "access_denied", "rate_limit", "proxy_config", "missing_key", "connect_timeout",
              "read_timeout", "timeout", "provider_http_error", "network_error", "invalid_response",
              "local_budget", "invalid_result", "total_timeout", "diagnostic_error",
          }
          checks = result.get("checks", [])
          if not isinstance(checks, list) or len(checks) > 6:
              fail("Unexpected maps diagnostic checks.")
          for check in checks:
              if (check.get("service") not in {"geocoder", "suggest"}
                  or check.get("route") not in {"auto", "ipv4", "proxy"}
                  or check.get("reason") not in allowed_reasons
                  or not isinstance(check.get("ok"), bool)
                  or check.get("http_status") is not None and not isinstance(check["http_status"], int)):
                  fail("Unexpected maps diagnostic result.")
          safe = {
              "release_sha": result["release_sha"],
              "application_route": "ipv4",
              "configured": {name: result.get("configured", {}).get(name) is True
                             for name in ("javascript", "geocoder", "suggest")},
              "checks": [{key: check[key] for key in ("service", "route", "ok", "http_status", "reason")}
                         for check in checks],
          }
          print(json.dumps(safe))
          working = {check["service"] for check in checks if check["route"] == "ipv4" and check["ok"]}
          if working != {"geocoder", "suggest"}:
              print("::warning::Yandex address services need attention; see the safe route comparison above.")
